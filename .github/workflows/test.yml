# The same gate release.yml runs before a tag, run on every push instead — so a
# broken Linux build is found on the commit that broke it rather than at tag
# time, when a red gate stops the release on all six platforms.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        # clippy and cargo test compile the tauri crate, which links
        # webkit2gtk/soup/gtk.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        # No explicit toolchain input: rustup resolves rust-toolchain.toml (the
        # single source of the pin) when cargo runs inside the repo.
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full check (oxlint, oxfmt, tsc, vite build, cargo fmt + clippy + test)
        run: pnpm check

      - name: Validate Tauri capabilities/permissions load
        run: pnpm tauri permission ls > /dev/null
